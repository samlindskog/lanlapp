                pendo.location.addTransforms([
                    {
                        attr: 'search',
                        action: 'AllowOnlyKeys',
                        data: US.utils.ga.whiteListedUrlTerms
                    },
                    {
                        attr: 'search',
                        action: 'AddTo',
                        data: function () {
                            const url = new URL(window.location.href);
                            if ((false && url.pathname.includes('OpportunityApplicants'))
                                || (false && url.pathname.includes('Pools'))
                                || (false && (url.pathname.includes('Recruiter/Candidates') || url.pathname.includes('CandidateAdd')))
                                || (false && url.pathname.includes('CandidateDetail'))

                                || (false && url.pathname.includes('OpportunityList'))
                                || (false && (/JobBoard\/[^\/]*\/Candidate\/ViewPresence[^\/]*$/.test(url.pathname)

                                       }

6nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003eWe are currently seeking a\u0026nbsp;\u003cstrong\u003eFull-Time Financial Consultant \u003c/strong\u003eto join our\u003cstrong\u003e Juan Tabo Branch \u003c/strong\u003ewho can work \u003cstrong\u003e37-40 hours per week\u003c/strong\u003e, with open availability \u003cstrong\u003eMonday-Saturday.\u003c/strong\u003e\u003c/span\u003e\u003cspan\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003eAs a Financial Consultant, you will be a trusted financial resource to existing and potential members by utilizing a consultative approach to evaluate, educate and fulfill members\u0026rsquo; financial needs. You will show adaptability and knowledge regarding all functions and processes of both the teller and platform operations. You will identify opportunity to refer members to business services, mortgage services, home equity lending, and investment services as needed.\u003c/span\u003e\u003cspan\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhat you\u0026rsquo;ll do:\u003c/strong\u003e\u003cspan\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAssist members with their financial needs through a consultative needs-based approach.\u003c/li\u003e\n\u003cli\u003eIdentify and educate members on value-added products/services to meet individual needs to include opening and closing accounts/memberships, consumer loans (excluding home loan products), and answering questions about products and services.\u003c/li\u003e\n\u003cli\u003eRefer members to specialized departments, as needed.\u003c/li\u003e\n\u003cli\u003eSupport the Teller line, as needed.\u003c/li\u003e\n\u003cli\u003eHandle problem resolution with your authority level.\u003c/li\u003e\n\u003cli\u003eProcess transactions in accordance with established policies, procedures, laws and regulations, and with a high degree of accuracy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003     <script>
        function escapeHtml(text) {
            if (text == null) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('showBanner') === 'true') {
                const banner = document.getElementById('Successbanner');
                const bannerMessage = escapeHtml($.t("Common.QuickApply.SuccessBannerMessage"));
                const bannerAction = escapeHtml($.t("Layout.AccessibilityBanner.DismissMessage"));
                if (banner) {
                    var ugkBanner = document.createElement('ukg-banner');
                    ugkBanner.setAttribute('inline', '');
                    ugkBanner.setAttribute('type', 'success');
                    ugkBanner.textContent = bannerMessage;

                    var endDiv = document.createElement('div');
                    endDiv.setAttribute('slot', 'end');

                    var ugkButton = document.createElement('ukg-button');
                    ugkButton.setAttribute('aria-label', 'banner-action');
                    ugkButton.setAttribute('emphasis', 'low');
                    ugkButton.textContent = bannerAction;
                    ugkButton.addEventListener('click', dismissBanner);

                    endDiv.appendChild(ugkButton);
                    ugkBanner.appendChild(endDiv);

                    banner.innerHTML = '';
                    banner.appendChild(ugkBanner);
                    banner.style.display = 'block';
                }
            }
        });
        function dismissBanner() {
            const banner = document.getElementById('Successbanner');
            if (banner) {
                banner.style.display = 'none';
            }
        }
        </script>
    <script>
            $(function () {
                // Clears out Matchinator session data
                $("#LogOutButton").click(function () {
                    US.utils.localStorage.removeItem('personalizedSearchProfile');
                    return true;
                });

                $("#skipLink").click(function () {
                    SkipToMainContent();

                });

                $("#skipLink").keyup(function (e) {
                    if (e.keyCode == 13) {
                        SkipToMainContent();
                    }
                });

                function SkipToMainContent() {
                    var ele = $("#PageContainer");
                    if (ele.length > 0) {
                        var scrollTopValue = ele.offset().top;
                        // Toggle-aware scroll value: sanitize when security fix is enabled
                        var scrollValue = true
                            ? Math.floor(Math.max(0, scrollTopValue))  // Security ON: sanitize (safe integer, non-negative)
                            : scrollTopValue;                          // Security OFF: original (backward compatible)

                        $('html, body').animate({
                            scrollTop: scrollValue
                        });

                        var headingEle = ele.find('h1:first, h2:first').eq(0);
                        var focusableElement;
                        if (headingEle.length > 0) {
                            focusableElement = headingEle;
                        } else {
                            focusableElement = ele;
                        }
                        focusableElement.attr("tabindex", "-1").css("outline", "none").focus();

                        return false;
                    }
                }

                $(window).resize(function () {
                    if ($(window).width() <= 767) {
                        $(".nav-pills.nav-responsive").addClass("nav-stacked");
                    } else {
                        $(".nav-pills.nav-responsive").removeClass("nav-stacked");
                    }
                });
                $(window).resize();
            });
        </script>
