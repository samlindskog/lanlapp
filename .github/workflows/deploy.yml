name: test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install "psycopg[binary]>=3.2"     # jobscan imports the driver; the adapter test is offline (JOBSCAN_BROWSER=0)
      - name: syntax
        run: python -m py_compile jobscan/jobscan.py jobscan/browser.py jobscan/core/*.py jobscan/sources/*.py jobboard/server.py jobboard/auth.py jobboard/mcp.py jobboard/service.py jobboard/runs.py jobboard/capacity.py jobboard/logbuf.py
      - name: adapter contract + stubbed scan (offline)
        run: JOBSCAN_BROWSER=0 python tests/test_adapters.py && JOBSCAN_BROWSER=0 python tests/test_browser.py && JOBSCAN_BROWSER=0 python tests/test_service.py && JOBSCAN_BROWSER=0 python tests/test_geo.py
      - name: dev stack with auth + nginx (production image and nginx rules)
        run: cd jobboard && ./dev.sh up-auth
      - name: smoke test through nginx (gate, cookies, tokens, MCP, job + resume round trip)
        run: tests/smoke.sh http://127.0.0.1:8081 http://127.0.0.1:8091 dev
      - name: image holds only the application
        run: |
          docker run --rm --entrypoint sh jobboard-jobboard -c 'find /app -maxdepth 2 | sort'
          docker run --rm --entrypoint sh jobboard-jobboard -c '! ls /app/jobboard/compose.yaml /app/jobboard/dev.sh /app/deploy 2>/dev/null'
      - name: stack logs
        if: failure()
        run: cd jobboard && docker compose -f compose.yaml -f compose.auth.yaml logs --tail 200

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - name: deploy over ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ]; then echo "DEPLOY_SSH_KEY secret not set; skipping deploy"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # The desktop runs production behind the WireGuard hub: DEPLOY_HOST is the hub's public address and
          # DEPLOY_PORT (2222) its DNAT to the desktop's sshd (1025) over wg0, so DEPLOY_KNOWN_HOSTS must hold
          # the DESKTOP's host key as seen through that port (ssh-keyscan -p 2222 <hub>). The hub forwards 2222
          # from GitHub Actions runner ranges only; on the desktop the deploy user is pinned to a forced command
          # (jobboard-deploy) that ignores whatever is sent and deploys origin/master. No docker access, no tty.
          # The ref is still sent: the deploy command installed by an older bootstrap read it, the current one ignores it.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -p "${PORT:-22}" "deploy@$HOST" "jobboard-deploy origin/master"
