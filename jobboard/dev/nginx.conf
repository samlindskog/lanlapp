# Dev nginx (compose.auth.yaml): the production rule snippets from deploy/nginx/ in front of the
# dev app container, plain HTTP on loopback. Web on host port 8081, MCP on host port 8091.
upstream jobboard_app { server jobboard:8080; }
upstream jobboard_mcp { server jobboard:8090; }
include /etc/nginx/jobboard/jobboard-auth.conf;

server {
    listen 80;
    client_max_body_size 2m;
    set $jb_scheme http;                 # no TLS in dev: cookies must not be marked Secure
    include /etc/nginx/jobboard/jobboard-web.conf;
}

server {
    listen 8090;
    include /etc/nginx/jobboard/jobboard-mcp.conf;
}
