# Dev stack: ./dev.sh up   (or: docker compose up -d --build)  -> http://127.0.0.1:8080, MCP http://127.0.0.1:8090/mcp
# No auth, loopback only. The code is bind-mounted over the image's copy and the server restarts on .py edits.
# Add compose.auth.yaml (./dev.sh up-auth) for the production-like variant: auth on + nginx in front.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobboard-db
    environment:
      POSTGRES_USER: jobscan
      POSTGRES_PASSWORD: jobscan
      POSTGRES_DB: jobscan
    volumes:
      - pgdata:/var/lib/postgresql/data      # persistent: survives compose down / image updates
    ports:
      - "127.0.0.1:5432:5432"                # host CLI only; never the LAN (trivial dev password)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscan -d jobscan"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jobboard:
    build:
      context: ..
      dockerfile: jobboard/Dockerfile
    container_name: jobboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      JOBSCAN_DSN: postgresql://jobscan:jobscan@db:5432/jobscan
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}      # from your shell or a jobboard/.env file (git-ignored)
      JOBBOARD_RELOAD: "1"                     # dev: auto-restart on .py changes; static files always fresh
      JOBBOARD_MCP_PORT: "8090"
      JOBBOARD_MCP_BIND: "0.0.0.0"             # inside the container; published on loopback below
      JOBSCAN_PROXY: ${JOBSCAN_PROXY:-}        # optional proxy for board scans (http://user:pass@host:port)
      JOBSCAN_PROXY_COUNTRIES: ${JOBSCAN_PROXY_COUNTRIES:-us,ca}   # exit countries cycled over the proxies
    volumes:
      - ./:/app/jobboard                       # server.py, auth.py, mcp.py, static/: live
      - ../jobscan:/app/jobscan                # adapters, live
    ports:
      - "127.0.0.1:8080:8080"                # web + API (direct, no nginx)
      - "127.0.0.1:8090:8090"                # MCP (direct); without auth any client on this Mac may call it
    shm_size: 512m                           # Chromium
    restart: unless-stopped

volumes:
  pgdata:
