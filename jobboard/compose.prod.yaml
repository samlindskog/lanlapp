# Production stack on the desktop (sldesktop). Run from /opt/jobboard (deploy/compose-up.sh does this):
#   docker compose -f jobboard/compose.prod.yaml --env-file .env up -d --build
# .env (deploy-owned, 0600) holds: POSTGRES_PASSWORD, JOBBOARD_PASSWORD_HASH, JOBBOARD_SECRET, OPENAI_API_KEY,
# SEARXNG_SECRET (crawl stack), optional JOBSCAN_PROXY*.
# The app image is built from the checkout and contains only jobboard/ and jobscan/; nothing is mounted.
# The app also joins the external network `crawl` (deploy/crawl/compose.yaml: Firecrawl + SearXNG), where it
# is reachable as `jobboard` (the proxy relay on 8899) and reaches firecrawl-api / searxng by name.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobboard-db
    environment:
      POSTGRES_USER: jobscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscan -d jobscan"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    # no ports, default network only: reachable from the app container alone

  jobboard:
    build:
      context: ..
      dockerfile: jobboard/Dockerfile
    container_name: jobboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      JOBSCAN_DSN: postgresql://jobscan:${POSTGRES_PASSWORD}@db:5432/jobscan
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JOBBOARD_AUTH: "1"
      JOBBOARD_PASSWORD_HASH: ${JOBBOARD_PASSWORD_HASH}
      JOBBOARD_SECRET: ${JOBBOARD_SECRET}
      JOBBOARD_MCP_PORT: "8090"
      JOBBOARD_MCP_BIND: "0.0.0.0"          # inside the container; the host maps it to loopback for nginx
      JOBSCAN_PROXY: ${JOBSCAN_PROXY:-}      # optional: http://user:pass@host:port (Decodo); empty = direct
      JOBSCAN_PROXY_COUNTRIES: ${JOBSCAN_PROXY_COUNTRIES:-us,ca}   # exit countries cycled over the proxies
      FIRECRAWL_URL: http://firecrawl-api:3002   # crawl stack, over the `crawl` network
      SEARXNG_URL: http://searxng:8080
      JOBSCAN_RELAY_PORT: "8899"            # proxy relay for the crawl stack (PROXY_SERVER=http://jobboard:8899); not published
      JOBSCAN_RELAY_PEERS: 172.31.0.0/24    # the relay accepts loopback + these CIDRs: the `crawl` network's fixed subnet
    networks: [default, crawl]
    dns: [1.1.1.1, 9.9.9.9]                  # resolved from inside the container (so via the hub once egress is on), never the host's LAN resolver
    ports:
      - "127.0.0.1:8080:8080"              # web + API: only via nginx (10.88.0.2:443, fed by the hub's DNAT)
      - "127.0.0.1:8091:8090"              # MCP: only via nginx (10.88.0.2:8090 over WireGuard)
    restart: unless-stopped
    mem_limit: 3g                            # desktop: room for Chromium with several tabs; browser.py still runs lean
    shm_size: 512m                           # Chromium's shared memory (renderer IPC); 256m on the old 2 GB VPS
    user: "65534:65534"                      # nobody: the app writes only to /tmp (browser profile)
    read_only: true
    tmpfs: ["/tmp:size=512m,exec"]           # exec: the patched chromedriver copy runs from here
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  default:                                   # fixed subnet: with crawl's 172.31.0.0/24 every container of ours is in 172.31.0.0/23,
    ipam:                                    # the range the desktop's egress policy routes via the hub (deploy/bootstrap.sh egress mode)
      config: [{subnet: 172.31.1.0/24}]
  crawl:
    external: true                           # docker network create --subnet 172.31.0.0/24 crawl (bootstrap and compose-up.sh do it)

volumes:
  pgdata:
