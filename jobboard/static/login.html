<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Board · sign in</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1c1c1c; --card: #fff; --line: #d9d9d4; --accent: #1f5f8b; --no: #9c2f2f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181a; --fg: #e6e6e3; --card: #1f2327; --line: #30343a; --accent: #6fb3e0; --no: #e06c6c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: var(--no); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <h1>Job Board</h1>
  <input type="password" id="pw" placeholder="password" autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ password: document.getElementById("pw").value }) });
    if (r.ok) location.href = new URLSearchParams(location.search).get("next") || "/";
    else document.getElementById("err").textContent = (await r.json().catch(() => ({}))).error || "sign-in failed";
  });
</script>
</body>
</html>
