<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Board</title>
<link rel="stylesheet" href="/common.css">
<style>
  td.score { color: var(--muted); font-size: 12px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 108px; background: var(--bg); font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  th.active { color: var(--accent); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  td.title { font-weight: 600; }
  td.title small { display: block; font-weight: 400; color: var(--muted); }
  td.fetched { color: var(--muted); white-space: nowrap; }
  .v-yes { background: var(--yes); } .v-maybe { background: var(--maybe); }
  .v-no { background: var(--no); } .v-none { background: var(--none); }
  .a-applied { background: var(--applied); } .a-drafted { background: #6b5ca5; }
  select.status { font: inherit; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
                  border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer;
                  -webkit-appearance: none; appearance: none; }
  select.status.a-applied, select.status.a-drafted { color: #fff; border-color: transparent; }
  select.status.a-applied { background: var(--applied); } select.status.a-drafted { background: #6b5ca5; }
  select.status.big { font-size: 13px; }
  select.status { width: 7.2em; text-align: center; }
  select.status.v-yes, select.status.v-maybe, select.status.v-no { color: #fff; border-color: transparent; }
  select.status.v-yes { background: var(--yes); } select.status.v-maybe { background: var(--maybe); } select.status.v-no { background: var(--no); }
  details.reason summary { color: var(--muted); font-size: 12px; }
  .closed { color: var(--muted); }
  th.sel, td.sel { width: 28px; padding-right: 0; display: none; }
  body.select-mode th.sel, body.select-mode td.sel { display: table-cell; }
  td.sel input, th.sel input { cursor: pointer; }
  body.select-mode tr.row td { user-select: none; }
  tr.row.selected td { background: color-mix(in srgb, var(--applied) 12%, transparent); }
  #layout { display: flex; align-items: flex-start; min-height: 100vh; }
  #content { flex: 1 1 auto; min-width: 0; }
  #bulk { flex: 0 0 250px; position: sticky; top: 0; max-height: 100vh; padding: 16px; background: var(--card);
          border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; overflow: auto; box-sizing: border-box; }
  #bulk[hidden] { display: none; }
  #bulk .close { align-self: flex-end; margin-top: -6px; }
  #bulk h3 { margin: 0 0 4px; font-size: 15px; }
  #bulk select, #bulk input { width: 100%; font: inherit; padding: 4px 8px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg); color: var(--fg); margin-top: 4px; }
  #bulkApply { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 800px) { #layout { flex-direction: column; } #bulk { flex-basis: auto; width: 100%; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); } }
  .soon { color: var(--maybe); font-weight: 600; }
  tr.detail td { background: var(--card); padding: 12px 14px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 18px; margin-bottom: 10px; }
  .detail-grid div { color: var(--muted); } .detail-grid div b { color: var(--fg); font-weight: 600; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); }
  pre.expanded { max-height: none; }
  pre.doc { max-height: 70vh; }
  button.more { margin: 4px 0 8px; font-size: 12px; }
  @media (max-width: 800px) {
    th.hide-sm, td.hide-sm { display: none; }
    th { top: auto; position: static; }
  }
</style>
</head>
<body>
<div id="layout">
<aside id="bulk" hidden>
  <button class="close" id="bulkClose" title="Exit selection mode">✕</button>
  <h3><span id="selCount">0</span> selected</h3>
  <label>Set status to<br><select id="bulkAction">
    <option value="applied">applied</option><option value="drafted">drafted</option></select></label>
  <label>Date<br><input type="date" id="bulkDate"></label>
  <label>Note (optional)<br><input type="text" id="bulkNote" placeholder="e.g. applied via USAJOBS"></label>
  <button id="bulkApply">Apply status to selected</button>
  <hr style="border:0;border-top:1px solid var(--line);width:100%">
  <label>Set verdict to<br><select id="bulkVerdict">
    <option value="yes">yes</option><option value="maybe">maybe</option><option value="no">no</option>
    <option value="__reset">reset to claude's</option></select></label>
  <button id="bulkVerdictApply">Apply verdict to selected</button>
  <button id="bulkClear">Clear selection</button>
  <p class="muted">Tip: click a checkbox, then shift-click another to select the range between them. The header checkbox selects everything listed.</p>
</aside>
<div id="content">
<header>
  <h1>Job Board <span class="count" id="count"></span> <a href="/scans.html" class="nav">Scans</a> <a href="#" id="logout" class="muted nav" hidden>sign out</a></h1>
  <div class="controls">
    <div class="group"><span class="label" title="None checked = all verdicts">Verdict</span>
      <label class="chk"><input type="checkbox" data-f="verdict" value="yes" checked> yes</label>
      <label class="chk"><input type="checkbox" data-f="verdict" value="maybe" checked> maybe</label>
      <label class="chk"><input type="checkbox" data-f="verdict" value="no"> no</label>
      <label class="chk"><input type="checkbox" data-f="verdict" value="none"> unjudged</label>
    </div>
    <div class="group"><span class="label">Applied</span>
      <select id="applied">
        <option value="any">any</option>
        <option value="applied">applied</option>
        <option value="not">not applied</option>
        <option value="drafted">drafted only</option>
        <option value="untouched">no action yet</option>
      </select>
    </div>
    <div class="group"><span class="label">Closing</span>
      <select id="openness">
        <option value="any">any</option>
        <option value="open" selected>still open</option>
        <option value="closed">closed</option>
        <option value="week">closes within 7 days</option>
      </select>
    </div>
    <div class="group"><span class="label">Board</span><select id="source"><option value="">all</option></select></div>
    <div class="group"><span class="label">Sort</span>
      <select id="sort">
        <option value="close_date:asc">closing date, soonest first</option>
        <option value="close_date:desc">closing date, latest first</option>
        <option value="verdict:asc">verdict (yes → no)</option>
        <option value="action:asc">applied first</option>
        <option value="title:asc">title A–Z</option>
        <option value="grade_low:asc">grade, low to high</option>
        <option value="first_seen:desc">newest in database</option>
        <option value="last_fetched:asc">least recently fetched first</option>
        <option value="last_fetched:desc">most recently fetched first</option>
      </select>
    </div>
    <div class="group"><input type="search" id="q" placeholder="filter as you type; press Enter for semantic search">
      <span id="semBadge" class="sem" hidden>semantic: <b id="semQuery"></b> <button id="semClear" title="back to normal order">✕</button></span>
      <span id="runBadge" class="sem" hidden title="only jobs this scan stored first">run <b id="runId"></b> <button id="runClear" title="all runs">✕</button></span></div>
    <button id="reset">Reset</button>
  </div>
  <div class="controls" style="margin-top:8px">
    <div class="group"><span class="label">Actions</span>
      <button id="scan" title="Fetch new postings from a job board">Scan…</button>
      <button id="refreshAll" title="Re-fetch every posting currently listed (current filters) so dates and text are current">Refresh</button>
      <button id="bulkToggle" title="Enter selection mode: shows checkboxes and the bulk status panel">Select…</button>
    </div>
    <span class="runline" id="runline"></span>
  </div>
</header>
<main>
  <table>
    <thead><tr>
      <th class="sel"><input type="checkbox" id="selAll" title="Select all listed"></th>
      <th data-sort="close_date">Closes</th>
      <th data-sort="verdict">Verdict</th>
      <th data-sort="action">Status</th>
      <th data-sort="title">Title</th>
      <th data-sort="grade_low" class="hide-sm">Grade</th>
      <th data-sort="board" class="hide-sm">Board</th>
      <th class="hide-sm">Location</th>
      <th data-sort="last_fetched" class="hide-sm">Fetched</th>
      <th class="hide-sm">Link</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
</div>
</div>
<script src="/common.js"></script>
<script src="/geo.js"></script>
<script src="/app.js"></script>
</body>
</html>
