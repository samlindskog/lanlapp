# /etc/nginx/sites-available/jobboard.conf — installed by deploy/bootstrap.sh together with the shared
# rule snippets in /etc/nginx/jobboard/ (deploy/nginx/jobboard-*.conf; the dev stack uses the same ones).
# TLS: Cloudflare Origin CA cert + Authenticated Origin Pulls from snippets/tls.conf (cert covers
# *.slindskog.net), so every name here is reachable only through the Cloudflare proxy.

include snippets/cloudflare-realip.conf;
server_tokens off;

upstream jobboard_app { server 127.0.0.1:8080; }   # container: web + API
upstream jobboard_mcp { server 127.0.0.1:8091; }   # container: MCP
include /etc/nginx/jobboard/jobboard-auth.conf;

# --- jobs.slindskog.net: login paths open, everything else needs a cookie or token -----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobs.slindskog.net;
    include snippets/tls.conf;
    access_log /var/log/nginx/jobs.slindskog.net.access.log;
    client_max_body_size 2m;
    set $jb_scheme https;
    include /etc/nginx/jobboard/jobboard-web.conf;
}

# --- MCP: WireGuard only, Bearer token only ------------------------------------------------------
# nftables admits port 8090 on wg0 alone (deploy/bootstrap.sh); the allow list here is the second layer.
server {
    listen 8090;
    server_name _;
    access_log /var/log/nginx/mcp.access.log;
    allow 10.88.0.0/24;                            # WireGuard subnet (server is 10.88.0.1)
    deny all;
    include /etc/nginx/jobboard/jobboard-mcp.conf;
}

# --- slindskog.net homepage (+ www -> apex) --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slindskog.net www.slindskog.net;
    include snippets/tls.conf;
    if ($host = www.slindskog.net) { return 301 https://slindskog.net$request_uri; }
    root /var/www/slindskog.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- anything else -> close ------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include snippets/tls.conf;
    access_log off;
    return 444;
}
