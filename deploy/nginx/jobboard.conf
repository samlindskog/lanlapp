# /etc/nginx/sites-available/jobboard.conf — installed by deploy/bootstrap.sh together with the rule
# snippets in /etc/nginx/jobboard/ (deploy/nginx/jobboard-*.conf; the dev stack uses auth/web/mcp unchanged).
# @WG_IP@ @HUB_IP@ @MCP_PORT@ @WG_NET@ are substituted by the bootstrap (nginx has no shell variables);
# this file is never loaded verbatim.
#
# Traffic path: Cloudflare -> hub (uscentral1, public 443, DNAT + masquerade) -> wg0 -> this host on
# @WG_IP@:443. nginx therefore binds the WireGuard address only; nothing listens on the LAN. TLS is the
# Cloudflare Origin CA cert + Authenticated Origin Pulls (jobboard-tls.conf), so every name here is
# reachable only through the Cloudflare proxy, exactly as on the VPS before.

include /etc/nginx/jobboard/jobboard-realip.conf;     # client IP from CF-Connecting-IP, trusted from the hub
server_tokens off;

upstream jobboard_app { server 127.0.0.1:8080; }   # container: web + API
upstream jobboard_mcp { server 127.0.0.1:8091; }   # container: MCP
include /etc/nginx/jobboard/jobboard-auth.conf;

# --- jobs.slindskog.net: login paths open, everything else needs a cookie or token -----------------
server {
    listen @WG_IP@:443 ssl;
    server_name jobs.slindskog.net;
    include /etc/nginx/jobboard/jobboard-tls.conf;
    access_log /var/log/nginx/jobs.slindskog.net.access.log;
    client_max_body_size 2m;
    set $jb_scheme https;
    include /etc/nginx/jobboard/jobboard-web.conf;
}

# --- MCP: WireGuard only, Bearer token only ------------------------------------------------------
# nftables admits @MCP_PORT@ on wg0 from the laptop alone (deploy/bootstrap.sh); the allow list is the second layer.
server {
    listen @WG_IP@:@MCP_PORT@;
    server_name _;
    access_log /var/log/nginx/mcp.access.log;
    allow @WG_NET@;                                # WireGuard subnet
    deny all;
    include /etc/nginx/jobboard/jobboard-mcp.conf;
}

# --- slindskog.net homepage (+ www -> apex) --------------------------------------------------------
server {
    listen @WG_IP@:443 ssl;
    server_name slindskog.net www.slindskog.net;
    include /etc/nginx/jobboard/jobboard-tls.conf;
    if ($host = www.slindskog.net) { return 301 https://slindskog.net$request_uri; }
    root /var/www/slindskog.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- anything else -> close ------------------------------------------------------------------------
server {
    listen @WG_IP@:443 ssl default_server;
    server_name _;
    include /etc/nginx/jobboard/jobboard-tls.conf;
    access_log off;
    return 444;
}
