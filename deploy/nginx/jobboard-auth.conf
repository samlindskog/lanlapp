# Credential pre-check (http context). Included by the production site and the dev nginx alike.
# nginx cannot verify a token or cookie signature (the app does that), but it can refuse to forward
# any request that carries neither a Bearer token nor a session cookie. Both maps run on every request.
map $http_authorization $jb_bearer {
    default 0;
    "~*^Bearer[ ]+jb_[A-Za-z0-9_-]{20,}$" 1;     # app tokens look like jb_<urlsafe base64>
}
map $cookie_jobboard_session $jb_cookie {
    default 0;
    "~^[0-9]{10}\.[0-9a-f]{16}\.[0-9a-f]{64}$" 1;  # <exp>.<nonce>.<hmac-sha256>
}
map "$jb_bearer$jb_cookie" $jb_anon {
    default 0;
    "00" 1;
}
