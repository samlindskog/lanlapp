# MCP locations (server context). Needs: upstream jobboard_mcp, the maps from jobboard-auth.conf.
# Cookies are meaningless to the MCP server, so only a Bearer token passes.
client_max_body_size 32m;                      # upload_resume carries base64 PDFs (15 MB raw max)

location = /mcp {
    if ($jb_bearer = 0) { return 401 '{"error": "bearer token required"}'; }
    proxy_pass http://jobboard_mcp;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;                   # refresh/scan tool calls can run a while
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location / { return 404; }
