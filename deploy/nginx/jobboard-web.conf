# Web + API locations (server context). Needs: upstream jobboard_app, the maps from jobboard-auth.conf.
proxy_http_version 1.1;
proxy_read_timeout 120s;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $jb_scheme;

# Login surface: the only paths an anonymous client may reach. /api/auth/token is a login too
# (it checks the password itself) and is throttled by the app like /api/auth/login.
location = /login          { proxy_pass http://jobboard_app; }
location = /login.html     { proxy_pass http://jobboard_app; }
location = /api/auth/login { proxy_pass http://jobboard_app; }
location = /api/auth/token { proxy_pass http://jobboard_app; }

# API: no credential -> 401 here, never forwarded.
location /api/ {
    if ($jb_anon) { return 401 '{"error": "authentication required (session cookie or Bearer token)"}'; }
    proxy_pass http://jobboard_app;
}

# Pages and /files/: no credential -> straight to the login page.
location / {
    if ($jb_anon) { return 302 /login.html?next=$request_uri; }
    proxy_pass http://jobboard_app;
}
