# Real client IP (http context). Production only: the dev nginx never includes it.
# Every request reaches this host from the hub (DNAT + masquerade over wg0), so the TCP peer is always
# @HUB_IP@ and the visitor's address is only in Cloudflare's CF-Connecting-IP header. Trust that header
# from the hub alone; @HUB_IP@ is substituted by deploy/bootstrap.sh.
set_real_ip_from @HUB_IP@;
real_ip_header CF-Connecting-IP;
