# TLS for every 443 server block (server context). Production only: the dev nginx never includes it.
# Cloudflare Origin CA certificate (covers *.slindskog.net; valid only towards Cloudflare's proxy) and
# Authenticated Origin Pulls: Cloudflare presents a client certificate signed by its origin-pull CA and
# nginx refuses any TLS client that does not. Installed 0600 root by deploy/bootstrap.sh from the files
# staged beside it (origin.pem, origin.key, cloudflare-origin-pull-ca.pem).
ssl_certificate         /etc/nginx/jobboard/certs/origin.pem;
ssl_certificate_key     /etc/nginx/jobboard/certs/origin.key;
ssl_client_certificate  /etc/nginx/jobboard/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client       on;
ssl_protocols           TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout     1d;
ssl_session_cache       shared:jb_tls:10m;
ssl_session_tickets     off;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
