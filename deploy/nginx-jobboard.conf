# /etc/nginx/sites-available/jobboard.conf — installed by deploy/bootstrap.sh
# TLS: Cloudflare Origin CA cert + Authenticated Origin Pulls from snippets/tls.conf (cert covers
# *.slindskog.net), so every name here is reachable only through the Cloudflare proxy.

include snippets/cloudflare-realip.conf;
server_tokens off;

# --- jobs.slindskog.net -> jobboard container on 127.0.0.1:8080 ----------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobs.slindskog.net;
    include snippets/tls.conf;
    access_log /var/log/nginx/jobs.slindskog.net.access.log;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- slindskog.net homepage (+ www -> apex) --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slindskog.net www.slindskog.net;
    include snippets/tls.conf;
    if ($host = www.slindskog.net) { return 301 https://slindskog.net$request_uri; }
    root /var/www/slindskog.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- anything else -> close ------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include snippets/tls.conf;
    access_log off;
    return 444;
}
