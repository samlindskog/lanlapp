# /etc/nginx/sites-available/jobboard.conf — installed by deploy/bootstrap.sh
# TLS: Cloudflare Origin CA cert + Authenticated Origin Pulls from snippets/tls.conf (cert covers
# *.slindskog.net), so every name here is reachable only through the Cloudflare proxy.

include snippets/cloudflare-realip.conf;
server_tokens off;

# --- credential pre-check ------------------------------------------------------------------------
# nginx cannot verify a token or cookie signature (the app does that), but it can refuse to forward
# any request that carries neither a Bearer token nor a session cookie. Only the login endpoints
# (listed as exact locations below) are reachable without one. Both maps run on every request.
map $http_authorization $jb_bearer {
    default 0;
    "~*^Bearer[ ]+jb_[A-Za-z0-9_-]{20,}$" 1;     # app tokens look like jb_<urlsafe base64>
}
map $cookie_jobboard_session $jb_cookie {
    default 0;
    "~^[0-9]{10}\.[0-9a-f]{16}\.[0-9a-f]{64}$" 1;  # <exp>.<nonce>.<hmac-sha256>
}
map "$jb_bearer$jb_cookie" $jb_anon {
    default 0;
    "00" 1;
}

# --- jobs.slindskog.net -> jobboard container on 127.0.0.1:8080 ----------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobs.slindskog.net;
    include snippets/tls.conf;
    access_log /var/log/nginx/jobs.slindskog.net.access.log;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Login surface: the only paths an anonymous client may reach. /api/auth/token is a login too
    # (it checks the password itself) and is throttled by the app like /api/auth/login.
    location = /login          { proxy_pass http://127.0.0.1:8080; }
    location = /login.html     { proxy_pass http://127.0.0.1:8080; }
    location = /api/auth/login { proxy_pass http://127.0.0.1:8080; }
    location = /api/auth/token { proxy_pass http://127.0.0.1:8080; }

    # API: no credential -> 401 here, never forwarded.
    location /api/ {
        if ($jb_anon) { return 401 '{"error": "authentication required (session cookie or Bearer token)"}'; }
        proxy_pass http://127.0.0.1:8080;
    }

    # Pages and /files/: no credential -> straight to the login page.
    location / {
        if ($jb_anon) { return 302 /login.html?next=$request_uri; }
        proxy_pass http://127.0.0.1:8080;
    }
}

# --- MCP: WireGuard only, Bearer token only ------------------------------------------------------
# The container publishes MCP on 127.0.0.1:8091; this server is the only path to it from the wg0
# side. nftables admits port 8090 on wg0 alone (deploy/bootstrap.sh); the allow list here is the
# second layer. Cookies are meaningless to the MCP server, so only a Bearer token passes.
server {
    listen 8090;
    server_name _;
    access_log /var/log/nginx/mcp.access.log;
    client_max_body_size 32m;                      # upload_resume carries base64 PDFs (15 MB raw max)
    allow 10.88.0.0/24;                            # WireGuard subnet (server is 10.88.0.1)
    deny all;

    location = /mcp {
        if ($jb_bearer = 0) { return 401 '{"error": "bearer token required"}'; }
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;                   # refresh/scan tool calls can run a while
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}

# --- slindskog.net homepage (+ www -> apex) --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slindskog.net www.slindskog.net;
    include snippets/tls.conf;
    if ($host = www.slindskog.net) { return 301 https://slindskog.net$request_uri; }
    root /var/www/slindskog.net;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- anything else -> close ------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include snippets/tls.conf;
    access_log off;
    return 444;
}
